[package]
name = "oneai-trace"
description = "OneAI Trajectory Logger — OpenInference-compatible trace mechanism for agent evaluation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["trace"]
trace = []
otel = ["dep:reqwest"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# Only pulled when the `otel` feature is on — powers the real OTLP/HTTP exporter
# (HttpOtlpExporter). All outbound HTTP goes through reqwest per CLAUDE.md so it
# honors HTTPS_PROXY/NO_PROXY uniformly. The opentelemetry SDK deps are left in
# the workspace for a future true-gRPC exporter; this crate uses reqwest for the
# OTLP/JSON wire format directly.
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }