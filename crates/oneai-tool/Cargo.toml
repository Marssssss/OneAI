[package]
name = "oneai-tool"
description = "OneAI tool management, registry, MCP integration, and approval gates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
rmcp = { workspace = true }
oneai-core = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
tokio-stream = { workspace = true }
dirs = { workspace = true }
html2text = "0.5"
walkdir = "2"
glob = "0.3"
urlencoding = "2"

[features]
default = []
# Serverless terminal backends (Phase 3.3 Stage F). reqwest/serde_json are
# already hard deps, so these features only gate whether the backend module
# is compiled — zero new dependencies, opt-in (off by default per 戒律 #3).
modal = []
daytona = []

[dev-dependencies]
tokio-test = "0.4"
axum = { workspace = true }
tempfile = { workspace = true }