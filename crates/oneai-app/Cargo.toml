[package]
name = "oneai-app"
description = "OneAI application integration layer — wires all modules together"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
oneai-core = { workspace = true }
oneai-bus = { workspace = true }
oneai-provider = { workspace = true }
oneai-agent = { workspace = true }
oneai-tool = { workspace = true }
oneai-memory = { workspace = true }
oneai-skill = { workspace = true }
dirs = { workspace = true }
oneai-parser = { workspace = true }
oneai-rag = { workspace = true }
oneai-workflow = { workspace = true }
oneai-scheduler = { workspace = true }
oneai-persistence = { workspace = true }
oneai-trace = { workspace = true }
oneai-domain = { workspace = true }
oneai-a2a = { workspace = true }
oneai-wasm = { workspace = true }
oneai-mcp = { workspace = true }
oneai-vector = { workspace = true }

[features]
# OTEL tracing helpers (trace_otel / trace_otel_http / trace_otel_config /
# otel_metrics). Off by default; enabling forwards to oneai-trace's `otel`
# feature so the OTLP exporter + OtelMetricsProvider actually compile & wire.
otel = ["oneai-trace/otel", "oneai-agent/otel"]

[dev-dependencies]
tempfile = "3"