[package]
name = "oneai-persistence"
description = "OneAI state persistence and checkpoint management — SQLite session store, STM/LTM/conversation persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
oneai-core = { workspace = true }
rusqlite = { workspace = true }
flate2 = { workspace = true }
# Shared Postgres backend (MVS3) — optional; enabled via the `postgres`
# feature (default off so local builds / crates.io releases stay light;
# the cloud engine image builds with `--features oneai-cli/postgres`).
deadpool-postgres = { workspace = true, optional = true }
# MVS3-B: PgMemoryStore LTM vector search (pgvector `vector` column + `<=>`
# KNN) — hard dependency of the `postgres` feature (Pg server must provide
# the extension; see pg_memory_store.rs module docs).
pgvector = { workspace = true, optional = true }
# Enables `with-chrono-0_4` on the tokio-postgres that deadpool-postgres
# re-exports (TIMESTAMPTZ ↔ chrono bindings) via feature unification.
tokio-postgres = { workspace = true, optional = true }

[features]
default = []
# PgWorkingStateStore — append-only event log + transactional brief index
# in a shared Postgres (docs/working-state-mechanism.md).
# MVS3-B adds PgMemoryStore (pgvector) / PgUsageTracker / PgHostAllowlist.
postgres = ["dep:deadpool-postgres", "dep:pgvector", "dep:tokio-postgres"]

[dev-dependencies]
tempfile = "3"
# Integration tests (tests/pg_working_state.rs) need the tokio macros +
# spawn; the lib's own dependency is not visible to integration tests.
tokio = { workspace = true }