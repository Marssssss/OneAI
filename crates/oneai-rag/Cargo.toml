[package]
name = "oneai-rag"
description = "OneAI RAG (Retrieval-Augmented Generation) support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
oneai-core = { workspace = true }
oneai-vector = { workspace = true }
fastembed = { workspace = true, optional = true }

[features]
# Local ONNX embedder/reranker via oneai-vector's `ort` stack (BGE-M3 +
# bge-reranker-v2-m3). Off by default — `ort-sys` downloads a prebuilt
# libonnxruntime blob and the embedder needs ONNX model files at runtime.
# When enabled, `BgeM3Adapter` is registered ahead of `FastEmbedAdapter` in
# the auto-chain (CJK-strong, pairs with tantivy-jieba BM25).
ort = ["oneai-vector/ort"]
# Local ONNX embedding via the `fastembed` crate (`FastEmbedService` +
# `FastEmbedAdapter`, the auto-chain's keyless last resort). Off by default
# so headless/cloud builds (MVS3-C image slimming) skip the ONNX runtime
# static link entirely;端侧 builds opt in via `oneai-cli`'s default feature.
# When disabled, an explicit `EmbeddingProvider::FastEmbed` config degrades
# gracefully to keyword recall (loud warning, never a hard failure), and the
# auto-chain simply ends one rung earlier.
fastembed = ["dep:fastembed"]