[package]
name = "oneai-supervisor"
description = "OneAI Supervisor — headless daemon supervising long-lived AgentLoop instances over IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
oneai-core = { workspace = true }
oneai-bus = { workspace = true }
oneai-agent = { workspace = true }
oneai-trace = { workspace = true, features = ["trace"] }

[features]
default = ["supervisor"]
supervisor = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
async-trait = { workspace = true }
chrono = { workspace = true }
oneai-core = { workspace = true }
oneai-agent = { workspace = true }
