[package]
name = "oneai-core"
description = "OneAI core types, traits, and abstractions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
tiktoken-rs = { workspace = true, optional = true }
uniffi = { workspace = true }

[features]
# Real BPE token counting (TiktokenTokenCounter). Off by default so core
# stays lean for embed/wasm targets; oneai-app + CLI enable it (gap P2 #13).
real-tokenizer = ["dep:tiktoken-rs"]