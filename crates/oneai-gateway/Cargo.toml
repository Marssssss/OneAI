[package]
name = "oneai-gateway"
description = "OneAI Gateway — message-platform bridge (Feishu/WeChat/loopback) making OneAI reachable as a bot over webhooks"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }

# Webhook HTTP surface (default — Feishu/WeChat push over HTTP).
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Feishu signature verification (plain SHA-256 over timestamp+nonce+body+token).
hex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# WeChat signature verification (SHA-1) + XML parsing.
sha1 = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }

[features]
default = ["axum-webhook"]
# axum webhook receiving surface (POST /gateway/{platform} + WeChat GET handshake).
axum-webhook = []
# Feishu (Lark) bot adapter — inbound event verification + outbound message send.
feishu = ["dep:hex", "dep:sha2"]
# WeChat Official Account adapter — signature handshake + XML parse + send.
wechat = ["dep:sha1", "dep:hex", "dep:quick-xml"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
