name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Build & Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # sqlite-vec / tantivy / usearch compile bundled C/C++; ubuntu-latest
      # ships build-essential, so no extra apt packages are required.
      # If a future subsystem needs libclang/protobuf, add them here.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Format check
        run: cargo fmt --all --check

      - name: Build (workspace + all targets)
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      # Enforcing: clippy runs under -D warnings. The historical lint tail was
      # cleared (local + CI toolchains aligned to rust 1.97), so new
      # contributions must not introduce clippy lints.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    # The workspace declares rust-version = "1.74" (root Cargo.toml). This job
    # verifies it actually builds on the declared MSRV; it is informational
    # (continue-on-error) because transitive deps may have bumped past 1.74.
    # If it stays green for a while, drop continue-on-error to enforce it.
    name: Build on MSRV (1.74)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.74
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
      - name: Build on MSRV
        run: cargo build --workspace -p oneai-core
