[package]
name = "xtask"
description = "OneAI workspace task runner — generates & verifies the model catalog from its snapshot."
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dev-only tool: never published to crates.io, never built by bare
# `cargo build` (excluded from `default-members`).
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "socks", "system-proxy"] }
tokio = { workspace = true }
